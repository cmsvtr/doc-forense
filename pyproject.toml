[project]
name = "doc-forense"
version = "0.1.0"
description = "Catálogo, OCR e triagem local de documentos para investigação de cartéis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.10",
    "python-docx>=1.1",
    "send2trash>=1.8",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "fpdf2>=2.7",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
