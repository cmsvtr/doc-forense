[server]
# Só aceita conexões deste computador: os documentos nunca ficam acessíveis pela rede.
address = "localhost"
port = 8501
# O navegador é aberto pelo abrir.bat; headless evita a pergunta de e-mail no primeiro uso.
headless = true
maxUploadSize = 2048

[browser]
# Não envia estatísticas de uso para fora.
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
# Clima de filme de espionagem: grafite, papel envelhecido, latão e um vermelho discreto.
# Sem fontes nem recursos da internet: o app roda offline.
base = "dark"
primaryColor = "#9B2F2F"
backgroundColor = "#121519"
secondaryBackgroundColor = "#1C2128"
textColor = "#E6E0D2"
linkColor = "#C9A85C"
borderColor = "#2E353F"
showWidgetBorder = true
baseRadius = "small"
redColor = "#C0574F"
greenColor = "#7FA678"
yellowColor = "#C9A85C"
blueColor = "#8AA0BA"
orangeColor = "#C98A4E"
violetColor = "#9A8FB5"
grayColor = "#8A94A3"

[theme.sidebar]
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#161A20"
textColor = "#D8D2C4"
borderColor = "#262C34"
